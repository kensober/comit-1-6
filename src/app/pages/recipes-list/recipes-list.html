<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Nombre</th>
      <th>dificultad</th>
      <th>acciones</th>
    </tr>
  </thead>
  <tbody>
    @for (i of recipesList.recipes; track i.id; let row = $index) {
      <tr>
        <td>{{ row + 1 }}</td>
        <td>{{ i.id }} - {{ i.name }}</td>
        <td>{{ i.difficulty }}</td>
        <td>
          <a [routerLink]="['/recipes-detail', i.id]">Ver detalle (etiqueta a)</a>
          <button type="button" (click)="viewDetails(i.id)">Ver detalle (botón)</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No se encontraron datos</td>
      </tr>
    }
  </tbody>
</table>
